
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Administração | Casa do Grão</title>

    <link rel="stylesheet" href="css/admin.css">
    <script src="js/admin.js" defer></script>
</head>

<body>

    <header class="admin-cabecalho">
        <div>
            <span>CASA DO GRÃO</span>
            <h1>Gerenciamento de pedidos</h1>
        </div>

        <button id="sair-admin" type="button" hidden>
            Sair
        </button>
    </header>

    <main class="admin-container">

        <!-- ACESSO ADMINISTRATIVO -->

        <section id="login-admin" class="admin-painel">

            <h2>Acesso administrativo</h2>

            <p>
                Entre com sua senha para gerenciar
                os pedidos da cafeteria.
            </p>

            <form id="form-login">

                <label for="senha-admin">
                    Senha administrativa
                </label>

                <input
                    type="password"
                    id="senha-admin"
                    autocomplete="current-password"
                    required>

                <button type="submit">
                    Entrar
                </button>

            </form>

            <p id="erro-login" role="alert"></p>

        </section>

        <!-- PEDIDOS RECEBIDOS -->

        <section id="painel-pedidos" hidden>

            <div class="admin-titulo">
                <div>
                    <h2>Pedidos recebidos</h2>
                    <p>
                        Confirme o Pix no Nubank antes
                        de liberar a preparação.
                    </p>
                </div>

                <button id="atualizar-pedidos" type="button">
                    Atualizar pedidos
                </button>
            </div>

            <p id="mensagem-admin" role="status"></p>

            <div id="lista-pedidos" class="admin-lista">
                <p>Carregando pedidos...</p>
            </div>

        </section>

    </main>

</body>
</html>
